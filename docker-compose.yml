services:
  # 1. THE BACKEND AGENT / ORCHESTRATOR
  backend: 
    build: 
      context: ./app-backend
      dockerfile: Dockerfile.app-backend
    container_name: app-backend
    
    # --- FIX 1: Use Host Networking ---
    network_mode: "host"
    

    environment:
      # --- FIX 3: Use 127.0.0.1 for host network communication ---
      - LLM_URL=http://127.0.0.1:11434
      - STT_URL=http://127.0.0.1:5000
      - TTS_URL=http://127.0.0.1:5001
      
    depends_on:
      # Use the looser 'service_started' condition now that healthcheck is unstable
      llm_service:
        condition: service_started
      stt_service:
        condition: service_started
      tts_service:
        condition: service_started
        
    volumes:
      - ./app-backend/src:/app/src # Live development mount
      
# -----------------------------------------------------------------------------
  
  # 2. THE LLM SERVER (Ollama)
  llm_service:
    build:
      context: ./llm_service
      dockerfile: Dockerfile.llm # Uses entrypoint.sh for model creation
    container_name: llm_service
    runtime: nvidia 
    
    # --- FIX 1: Add Host Networking ---
    network_mode: "host" 
    ports:
      - "11434:11434" # Keep this for external access to Ollama API
    
    # Healthcheck is now unreliable due to host network/model creation race, but kept for monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
              
# -----------------------------------------------------------------------------

  # 3. STT SERVICE (Faster Whisper)
  stt_service:
    build: 
      context: ./stt_service
      dockerfile: Dockerfile.stt
    container_name: stt_service
    ports:
      - "5000:5000" # Keep this for external access to STT service

    runtime: nvidia
    shm_size: '2gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./stt_service/model_cache:/app/hf_cache # Local model cache mount
    environment:
      - WHISPER_MODEL=medium

# -----------------------------------------------------------------------------

  # 4. TTS SERVICE (Piper)
  tts_service:
    build: 
      context: ./tts_service
      dockerfile: Dockerfile.tts
    container_name: tts_service
    
    ports:
      - "5001:5001" # Keep this for external access to TTS service
    
    volumes:
      - ./tts_service:/app # Live development mount for server.py code